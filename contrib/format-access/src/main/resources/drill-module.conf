#  This file tells Drill to consider this module when class path scanning.
#  This file can also include any supplementary configuration information.
#  This file is in HOCON format, see https://github.com/typesafehub/config/blob/master/HOCON.md for more information.
drill.classpath.scanning: {
  packages += "org.apache.drill.exec.store.msaccess"
}

drill.exec.storage.msaccess: {
  # An Access file can define linked tables that point at another database file by an absolute
  # local path or a UNC share. Following them makes the Drillbit open a path chosen by the file's
  # author, as the Drillbit service account, so this is off by default. It is a boot option so
  # that it can only be enabled by an administrator, not by a query.
  allow_linked_databases: false
}
